<!doctype html>
<meta charset="utf-8">
<title>封面：录制契约</title>
<!-- 封面是作者单写的一页（两次截图：1920×1080 与 1440×1080），不要放无限动画。 -->
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box }
  html, body { margin: 0; height: 100% }
  body {
    background: radial-gradient(circle at 82% 14%, #1e3a8a 0%, #0b1120 58%, #060a14 100%);
    color: #f8fafc; display: flex; align-items: center;
    font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap { padding: 0 9%; display: flex; flex-direction: column; gap: 22px }
  .rule { width: 148px; height: 6px; background: #7aa2f7; border-radius: 3px }
  .kicker { font-size: 26px; letter-spacing: .3em; color: #93c5fd; text-transform: uppercase }
  h1 { margin: 0; font-size: clamp(52px, 6.6vw, 118px); line-height: 1.06; letter-spacing: -.01em }
  .sub { font-size: clamp(24px, 2.3vw, 38px); color: #cbd5f5 }
  .foot { font-size: clamp(19px, 1.7vw, 28px); color: #94a3b8 }
  @media (max-aspect-ratio: 4/3) {
    .wrap { padding: 0 7%; gap: 16px }
    h1 { font-size: 80px }
    .sub { font-size: 32px }
  }
</style>
<div class="wrap">
  <div class="rule"></div>
  <div class="kicker">RECORDING CONTRACT</div>
  <h1>录制契约</h1>
  <div class="sub">切页等多久，由幻灯片说了算</div>
  <div class="foot">每句的第一帧，都应该是稳定版面</div>
</div>
