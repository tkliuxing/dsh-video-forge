<!doctype html>
<meta charset="utf-8">
<title>封面：页内动效库</title>
<!--
  封面页（meta.cover 指到这里）。同一页会被截两次：1920×1080（16:9）与
  1440×1080（4:3），等高、只改宽，所以版面写成流式的，用 media query 调 4:3
  下的字号与留白，不写死 1920px。

  契约比 deck 轻：不需要 teachReady / teachCue / teachPage。截图前会等
  document.fonts.ready 加 150 ms，所以这里不能有无限动画（会截到中间态）。
-->
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box }
  html, body { margin: 0; height: 100% }
  body {
    background: radial-gradient(circle at 80% 12%, #1e3a8a 0%, #0b1120 58%, #060a14 100%);
    color: #f8fafc;
    font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
  }
  .wrap { padding: 0 9%; display: flex; flex-direction: column; gap: 24px }
  .rule { width: 148px; height: 6px; background: #fbbf24; border-radius: 3px }
  .kicker { font-size: 26px; letter-spacing: .32em; color: #93c5fd; text-transform: uppercase }
  h1 { margin: 0; font-size: clamp(54px, 7vw, 124px); line-height: 1.06; letter-spacing: -.01em }
  .sub { font-size: clamp(24px, 2.4vw, 40px); color: #cbd5f5 }
  .foot { font-size: clamp(19px, 1.7vw, 28px); color: #94a3b8; margin-top: 6px }
  /* 4:3：画面更窄，标题降一档、留白收紧，避免标题折成三行 */
  @media (max-aspect-ratio: 4/3) {
    .wrap { padding: 0 7%; gap: 18px }
    h1 { font-size: 84px }
    .sub { font-size: 34px }
  }
</style>
<div class="wrap">
  <div class="rule"></div>
  <div class="kicker">MOTION LIBRARY</div>
  <h1>页内动效库</h1>
  <div class="sub">七种动效，一个 0 毫秒的对照</div>
  <div class="foot">同样的花样，区别只在时长：480 毫秒是"动起来"，0 毫秒是"闪一下"</div>
</div>
